name: Validar aplicação Next.js
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-cms.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-validation
          path: artifacts/model2/cms-integration.json
